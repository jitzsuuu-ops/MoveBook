<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Movebook">
<title>Movebook — Client Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1210;
    --panel: #141713;
    --card: #1B1F1A;
    --border: #262B25;
    --text: #EDEFEA;
    --muted: #6B7268;
    --muted2: #8A9086;
    --accent: #C8FF3D;
    --accent-dark: #0F1210;
    --danger: #7A2E2E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding-bottom: 40px;
    position: relative;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  /* Header */
  .header { padding: 24px 20px 0 20px; position: sticky; top: 0; background: var(--panel); z-index: 5; padding-top: calc(24px + env(safe-area-inset-top)); }
  .brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .brand-mark { width: 10px; height: 10px; background: var(--accent); border-radius: 2px; }
  .brand-text { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 3px; }
  .back-btn { display: flex; align-items: center; gap: 4px; background: none; border: none; color: var(--muted2); font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1.5px; padding: 6px 0 20px 0; }
  .tabs { display: flex; gap: 4px; margin-bottom: 0; border-bottom: 1px solid var(--border); }
  .tab { background: none; border: none; color: #5C6259; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1.5px; padding: 0 4px 12px 4px; margin-right: 20px; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

  .error-banner { margin: 10px 20px 0 20px; padding: 8px 12px; background: #3A1F1F; color: #FF9B9B; font-size: 12px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; }

  /* Schedule */
  .schedule-wrap { padding: 16px 20px 100px 20px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-arrow { background: var(--card); border: 1px solid var(--border); border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cal-date-block { text-align: center; }
  .cal-day-name { font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .cal-day-name.today { color: var(--accent); }
  .cal-date-full { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 0.5px; }
  .cal-today-btn { display: block; margin: 10px auto 0 auto; background: none; border: none; color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; padding: 4px 10px; }
  .cal-sessions { margin-top: 20px; }
  .day-block { margin-bottom: 22px; }
  .day-label-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .day-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .day-label.today { color: var(--accent); }
  .today-dot { width: 5px; height: 5px; border-radius: 5px; background: var(--accent); }
  .day-empty { color: #3A3F38; font-size: 13px; padding-left: 2px; }
  .session-list { display: flex; flex-direction: column; gap: 6px; }
  .session-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%; text-align: left; }
  .session-time { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); min-width: 66px; }
  .session-divider { width: 1px; height: 16px; background: #2A2F28; }
  .avatar-sm { width: 22px; height: 22px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--accent-dark); flex-shrink: 0; }
  .session-name { font-size: 14px; font-weight: 500; }
  .chev { color: #4A4F49; margin-left: auto; flex-shrink: 0; }

  /* Roster */
  .roster-wrap { padding: 16px 20px 100px 20px; position: relative; min-height: 300px; }
  .roster-list { display: flex; flex-direction: column; gap: 8px; }
  .roster-row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; width: 100%; text-align: left; }
  .avatar { width: 38px; height: 38px; border-radius: 38px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--accent-dark); flex-shrink: 0; }
  .roster-info { flex: 1; min-width: 0; }
  .roster-name { font-size: 15px; font-weight: 600; }
  .roster-meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }

  .fab { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 60px; background: var(--accent); border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 24px rgba(200,255,61,0.35); z-index: 6; }

  /* Empty state */
  .empty-state { padding: 60px 20px; text-align: center; }
  .empty-number { font-family: 'JetBrains Mono', monospace; font-size: 40px; color: #232823; font-weight: 700; margin-bottom: 8px; }
  .empty-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .empty-body { font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 260px; margin: 0 auto; }

  /* Detail */
  .detail-wrap { padding: 8px 20px 60px 20px; }
  .detail-hero { text-align: center; padding: 20px 0 28px 0; }
  .avatar-lg { width: 60px; height: 60px; border-radius: 60px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: var(--accent-dark); margin: 0 auto 12px auto; }
  .detail-name { font-size: 19px; font-weight: 700; }
  .detail-notes { font-size: 13px; color: var(--muted2); margin-top: 6px; line-height: 1.5; padding: 0 20px; }

  .section-label-row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; margin-bottom: 10px; }
  .section-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--muted); }
  .section-action { background: none; border: none; color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; }
  .section-empty { font-size: 13px; color: #4A4F49; padding: 4px 0; }

  .slot-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot-chip { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .slot-day { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 1px; }
  .slot-time { font-size: 13px; }
  .slot-remove { background: none; border: none; color: #4A4F49; padding: 0; display: flex; }

  .workout-list { display: flex; flex-direction: column; gap: 8px; }
  .workout-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .workout-card-head { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; padding: 12px 14px; text-align: left; }
  .workout-title { font-size: 14px; font-weight: 600; flex: 1; }
  .workout-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .workout-chev { transition: transform 120ms; color: #4A4F49; flex-shrink: 0; }
  .workout-chev.open { transform: rotate(90deg); }
  .workout-body { padding: 0 14px 14px 14px; display: none; flex-direction: column; gap: 6px; }
  .workout-body.open { display: flex; }
  .exercise-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #21251F; gap: 10px; }
  .exercise-detail { color: var(--muted2); font-family: 'JetBrains Mono', monospace; font-size: 12px; white-space: nowrap; }
  .workout-notes { font-size: 12px; color: var(--muted2); margin-top: 6px; line-height: 1.5; font-style: italic; }
  .delete-workout-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: #8A5C5C; font-size: 12px; margin-top: 8px; padding: 0; }

  .danger-zone { margin-top: 36px; text-align: center; }
  .danger-btn { background: none; border: none; color: #5C4646; font-size: 12px; }
  .danger-confirm { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 13px; color: var(--muted2); }
  .danger-btn-confirm { background: var(--danger); color: #FFD6D6; border: none; border-radius: 6px; padding: 6px 14px; font-size: 12px; }
  .danger-btn-cancel { background: #232823; color: #9CA39A; border: none; border-radius: 6px; padding: 6px 14px; font-size: 12px; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal-overlay.open { display: flex; }
  .modal-sheet { width: 100%; max-width: 480px; background: #181C17; border-radius: 18px 18px 0 0; border: 1px solid var(--border); border-bottom: none; max-height: 85vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 10px 20px; position: sticky; top: 0; background: #181C17; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-close { background: #232823; border: none; border-radius: 20px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: #9CA39A; }
  .modal-body { padding: 0 20px 28px 20px; }

  .field-label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: var(--muted); margin-top: 16px; margin-bottom: 6px; }
  .input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; color: var(--text); font-size: 14px; margin-bottom: 4px; box-sizing: border-box; outline: none; }
  textarea.input { min-height: 70px; resize: none; }
  .primary-btn { width: 100%; background: var(--accent); color: var(--accent-dark); border: none; border-radius: 8px; padding: 13px; font-size: 14px; font-weight: 700; margin-top: 22px; }
  .primary-btn:disabled { opacity: 0.4; }

  .day-picker { display: flex; gap: 6px; }
  .day-picker-btn { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 0; color: var(--muted2); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .day-picker-btn.active { background: var(--accent); color: var(--accent-dark); border-color: var(--accent); font-weight: 700; }

  .exercise-form { display: flex; flex-direction: column; gap: 10px; }
  .exercise-entry { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .exercise-form-row { display: flex; gap: 6px; align-items: center; }
  .exercise-form-row + .exercise-form-row { margin-top: 6px; }
  .exercise-form-row .input { margin-bottom: 0; }
  .remove-row-btn { background: none; border: none; color: #5C4646; padding: 4px; display: flex; flex-shrink: 0; }
  .add-row-btn { display: flex; align-items: center; gap: 6px; background: none; border: 1px dashed #333831; border-radius: 8px; padding: 9px 12px; color: var(--muted2); font-size: 12px; justify-content: center; margin-top: 2px; width: 100%; }

  svg { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const DAY_FULL = { Mon:"Monday", Tue:"Tuesday", Wed:"Wednesday", Thu:"Thursday", Fri:"Friday", Sat:"Saturday", Sun:"Sunday" };
  const INITIALS_BG = ["#C8FF3D","#5DE0C8","#FF7A59","#7A9EFF","#FFD166"];
  const STORAGE_KEY = "ledger_clients_v1";

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function timeToMinutes(t){ if(!t) return 9999; const [h,m]=t.split(":").map(Number); return h*60+m; }
  function formatTime(t){ if(!t) return ""; const [h,m]=t.split(":").map(Number); const period=h>=12?"PM":"AM"; const h12=h%12===0?12:h%12; return h12+":"+String(m).padStart(2,"0")+" "+period; }
  function initialsColor(name){ let sum=0; for(let i=0;i<name.length;i++) sum+=name.charCodeAt(i); return INITIALS_BG[sum % INITIALS_BG.length]; }
  function esc(s){ const d=document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
  function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

  // ---- State ----
  let clients = [];
  let view = "schedule"; // schedule | clients | detail
  let activeClientId = null;
  let error = null;
  let scheduleDate = startOfDay(new Date());

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) clients = JSON.parse(raw);
    } catch (e) { clients = []; }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
      error = null;
    } catch (e) {
      error = "Couldn't save — try again.";
    }
  }

  function getActiveClient() { return clients.find(c => c.id === activeClientId); }

  // ---- Icons (minimal inline SVG) ----
  const ICONS = {
    plus: (s=24,c="currentColor") => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
    x: (s=18,c="currentColor") => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
    chevronRight: (s=16,c="#4A4F49") => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`,
    chevronLeft: (s=18,c="currentColor") => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`,
    dumbbell: (s=15,c="#C8FF3D") => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>`,
    trash: (s=13,c="currentColor") => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`
  };

  // ---- Render ----
  function render() {
    const app = document.getElementById("app");
    let html = "";

    // Header
    html += `<div class="header">`;
    if (view === "detail") {
      html += `<button class="back-btn" id="backBtn">${ICONS.chevronLeft(18)}<span>ROSTER</span></button>`;
    } else {
      html += `<div class="brand-row"><div class="brand-mark"></div><div class="brand-text">MOVEBOOK</div></div>`;
      html += `<div class="tabs">
        <button class="tab ${view==='schedule'?'active':''}" id="tabSchedule">SCHEDULE</button>
        <button class="tab ${view==='clients'?'active':''}" id="tabRoster">ROSTER</button>
      </div>`;
    }
    html += `</div>`;

    if (error) html += `<div class="error-banner">${esc(error)}</div>`;

    if (view === "schedule") html += renderSchedule();
    else if (view === "clients") html += renderRoster();
    else if (view === "detail") html += renderDetail();

    app.innerHTML = html;
    attachListeners();
  }

  function renderSchedule() {
    const hasAny = clients.some(c => c.sessions.length > 0);
    const today = new Date();
    const isToday = isSameDay(scheduleDate, today);
    const dow = DAYS[(scheduleDate.getDay() + 6) % 7];
    const dayName = scheduleDate.toLocaleDateString(undefined, { weekday: "long" });
    const dateFull = scheduleDate.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });

    let html = `<div class="schedule-wrap">`;
    html += `<div class="cal-nav">
      <button class="cal-arrow" id="calPrev">${ICONS.chevronLeft(20, "#8A9086")}</button>
      <div class="cal-date-block">
        <div class="cal-day-name ${isToday ? 'today' : ''}">${esc(dayName)}${isToday ? '<span class="today-dot"></span>' : ''}</div>
        <div class="cal-date-full">${esc(dateFull)}</div>
      </div>
      <button class="cal-arrow" id="calNext">${ICONS.chevronRight(20, "#8A9086")}</button>
    </div>`;
    if (!isToday) html += `<button class="cal-today-btn" id="calToday">Jump to today</button>`;

    if (!hasAny) {
      html += `<div class="empty-state">
        <div class="empty-number">00</div>
        <div class="empty-title">No sessions scheduled</div>
        <div class="empty-body">Add a client, then set their weekly time slots. This view fills in automatically.</div>
      </div>`;
      html += `</div>`;
      return html;
    }

    const items = [];
    clients.forEach(c => c.sessions.filter(s => s.day === dow).forEach(s => items.push({ client: c, session: s })));
    items.sort((a, b) => timeToMinutes(a.session.time) - timeToMinutes(b.session.time));

    html += `<div class="cal-sessions">`;
    if (items.length === 0) {
      html += `<div class="day-empty">No sessions this day.</div>`;
    } else {
      html += `<div class="session-list">`;
      items.forEach(({ client, session }) => {
        html += `<button class="session-row" data-open-client="${client.id}">
          <span class="session-time">${formatTime(session.time)}</span>
          <span class="session-divider"></span>
          <span class="avatar-sm" style="background:${initialsColor(client.name)}">${esc(client.name.charAt(0).toUpperCase())}</span>
          <span class="session-name">${esc(client.name)}</span>
          <span class="chev">${ICONS.chevronRight()}</span>
        </button>`;
      });
      html += `</div>`;
    }
    html += `</div></div>`;
    return html;
  }

  function renderRoster() {
    let html = `<div class="roster-wrap">`;
    if (clients.length === 0) {
      html += `<div class="empty-state">
        <div class="empty-number">00</div>
        <div class="empty-title">No clients yet</div>
        <div class="empty-body">Add your first client to start tracking sessions and workouts.</div>
      </div>`;
    } else {
      html += `<div class="roster-list">`;
      clients.slice().sort((a,b) => a.name.localeCompare(b.name)).forEach(c => {
        html += `<button class="roster-row" data-open-client="${c.id}">
          <span class="avatar" style="background:${initialsColor(c.name)}">${esc(c.name.charAt(0).toUpperCase())}</span>
          <div class="roster-info">
            <div class="roster-name">${esc(c.name)}</div>
            <div class="roster-meta">${c.sessions.length} session${c.sessions.length!==1?'s':''}/wk · ${c.workouts.length} logged</div>
          </div>
          ${ICONS.chevronRight(18)}
        </button>`;
      });
      html += `</div>`;
    }
    html += `<button class="fab" id="addClientFab">${ICONS.plus(24,"#0F1210")}</button>`;
    html += `</div>`;
    return html;
  }

  function renderDetail() {
    const client = getActiveClient();
    if (!client) return `<div class="empty-state"><div class="empty-title">Client not found</div></div>`;

    const sortedSessions = [...client.sessions].sort((a,b) => DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || timeToMinutes(a.time)-timeToMinutes(b.time));

    let html = `<div class="detail-wrap">
      <div class="detail-hero">
        <span class="avatar-lg" style="background:${initialsColor(client.name)}">${esc(client.name.charAt(0).toUpperCase())}</span>
        <div class="detail-name">${esc(client.name)}</div>
        ${client.notes ? `<div class="detail-notes">${esc(client.notes)}</div>` : ''}
      </div>

      <div class="section-label-row">
        <span class="section-label">WEEKLY SLOTS</span>
        <button class="section-action" id="addSessionBtn">+ ADD</button>
      </div>`;

    if (sortedSessions.length === 0) {
      html += `<div class="section-empty">No time slots set.</div>`;
    } else {
      html += `<div class="slot-grid">`;
      sortedSessions.forEach(s => {
        html += `<div class="slot-chip">
          <span class="slot-day">${s.day}</span>
          <span class="slot-time">${formatTime(s.time)}</span>
          <button class="slot-remove" data-remove-session="${s.id}">${ICONS.x(13)}</button>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="section-label-row">
        <span class="section-label">WORKOUT LOG</span>
        <button class="section-action" id="addWorkoutBtn">+ LOG</button>
      </div>`;

    if (client.workouts.length === 0) {
      html += `<div class="section-empty">No workouts logged yet.</div>`;
    } else {
      html += `<div class="workout-list">`;
      client.workouts.forEach(w => {
        const d = new Date(w.date);
        const dateStr = d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
        html += `<div class="workout-card">
          <button class="workout-card-head" data-toggle-workout="${w.id}">
            ${ICONS.dumbbell()}
            <span class="workout-title">${esc(w.title || "Session")}</span>
            <span class="workout-date">${dateStr}</span>
            <span class="workout-chev" id="chev-${w.id}">${ICONS.chevronRight(15)}</span>
          </button>
          <div class="workout-body" id="body-${w.id}">
            ${w.exercises.map(ex => `<div class="exercise-row">
              <span>${esc(ex.name)}</span>
              <span class="exercise-detail">${ex.sets && ex.reps ? esc(ex.sets)+' × '+esc(ex.reps) : esc(ex.sets||ex.reps||'')}${ex.weight? '  '+esc(ex.weight):''}</span>
            </div>`).join('')}
            ${w.notes ? `<div class="workout-notes">${esc(w.notes)}</div>` : ''}
            <button class="delete-workout-btn" data-delete-workout="${w.id}">${ICONS.trash()} Remove</button>
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="danger-zone" id="dangerZone">
        <button class="danger-btn" id="removeClientBtn">Remove client</button>
      </div>
    </div>`;

    return html;
  }

  // ---- Modals ----
  function openModal(title, bodyHtml, onMount) {
    let overlay = document.getElementById("modalOverlay");
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.id = "modalOverlay";
      document.body.appendChild(overlay);
    }
    overlay.innerHTML = `<div class="modal-sheet" id="modalSheet">
      <div class="modal-head">
        <span class="modal-title">${esc(title)}</span>
        <button class="modal-close" id="modalCloseBtn">${ICONS.x(18)}</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
    </div>`;
    overlay.classList.add("open");
    overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
    document.getElementById("modalCloseBtn").onclick = closeModal;
    if (onMount) onMount();
  }
  function closeModal() {
    const overlay = document.getElementById("modalOverlay");
    if (overlay) overlay.classList.remove("open");
  }

  function showAddClientModal() {
    openModal("New client", `
      <label class="field-label">Name</label>
      <input class="input" id="acName" placeholder="e.g. Thomroy Diaz">
      <label class="field-label">Notes (optional)</label>
      <textarea class="input" id="acNotes" placeholder="Goals, injuries, anything worth remembering"></textarea>
      <button class="primary-btn" id="acSave" disabled>Add client</button>
    `, () => {
      const nameInput = document.getElementById("acName");
      const saveBtn = document.getElementById("acSave");
      nameInput.addEventListener("input", () => { saveBtn.disabled = !nameInput.value.trim(); });
      nameInput.focus();
      saveBtn.onclick = () => {
        const name = nameInput.value.trim();
        if (!name) return;
        const notes = document.getElementById("acNotes").value.trim();
        clients.push({ id: uid(), name, notes, sessions: [], workouts: [] });
        save();
        closeModal();
        render();
      };
    });
  }

  function showAddSessionModal() {
    let day = "Mon";
    openModal("Add weekly slot", `
      <label class="field-label">Day</label>
      <div class="day-picker" id="dayPicker">
        ${DAYS.map(d => `<button class="day-picker-btn ${d==='Mon'?'active':''}" data-day="${d}">${d}</button>`).join('')}
      </div>
      <label class="field-label">Time</label>
      <input class="input" id="asTime" type="time" value="09:00">
      <button class="primary-btn" id="asSave">Add slot</button>
    `, () => {
      document.querySelectorAll("#dayPicker .day-picker-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#dayPicker .day-picker-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          day = btn.getAttribute("data-day");
        };
      });
      document.getElementById("asSave").onclick = () => {
        const time = document.getElementById("asTime").value || "09:00";
        const client = getActiveClient();
        client.sessions.push({ id: uid(), day, time });
        save();
        closeModal();
        render();
      };
    });
  }

  function showAddWorkoutModal() {
    let rowCount = 1;
    openModal("Log workout", `
      <label class="field-label">Title (optional)</label>
      <input class="input" id="awTitle" placeholder="e.g. Lower body, prehab focus">
      <label class="field-label">Exercises</label>
      <div class="exercise-form" id="exerciseForm">
        <div class="exercise-entry" data-row="0">
          <div class="exercise-form-row">
            <input class="input" placeholder="Exercise name" data-field="name">
          </div>
          <div class="exercise-form-row">
            <input class="input" style="flex:1" placeholder="Sets" data-field="sets">
            <input class="input" style="flex:1" placeholder="Reps" data-field="reps">
            <input class="input" style="flex:1" placeholder="Weight" data-field="weight">
          </div>
        </div>
      </div>
      <button class="add-row-btn" id="addExerciseRow">${ICONS.plus(13)} Add exercise</button>
      <label class="field-label">Notes (optional)</label>
      <textarea class="input" id="awNotes" placeholder="How it felt, cues, adjustments for next time"></textarea>
      <button class="primary-btn" id="awSave">Save workout</button>
    `, () => {
      const form = document.getElementById("exerciseForm");
      document.getElementById("addExerciseRow").onclick = () => {
        const entry = document.createElement("div");
        entry.className = "exercise-entry";
        entry.setAttribute("data-row", String(rowCount++));
        entry.innerHTML = `
          <div class="exercise-form-row">
            <input class="input" placeholder="Exercise name" data-field="name">
            <button class="remove-row-btn">${ICONS.x(14)}</button>
          </div>
          <div class="exercise-form-row">
            <input class="input" style="flex:1" placeholder="Sets" data-field="sets">
            <input class="input" style="flex:1" placeholder="Reps" data-field="reps">
            <input class="input" style="flex:1" placeholder="Weight" data-field="weight">
          </div>
        `;
        entry.querySelector(".remove-row-btn").onclick = () => entry.remove();
        form.appendChild(entry);
      };
      document.getElementById("awSave").onclick = () => {
        const title = document.getElementById("awTitle").value.trim();
        const notes = document.getElementById("awNotes").value.trim();
        const exercises = [];
        form.querySelectorAll(".exercise-entry").forEach(entry => {
          const name = entry.querySelector('[data-field="name"]').value.trim();
          const sets = entry.querySelector('[data-field="sets"]').value.trim();
          const reps = entry.querySelector('[data-field="reps"]').value.trim();
          const weight = entry.querySelector('[data-field="weight"]').value.trim();
          if (name) exercises.push({ name, sets, reps, weight });
        });
        if (exercises.length === 0) return;
        const client = getActiveClient();
        client.workouts.unshift({ id: uid(), date: new Date().toISOString(), title, notes, exercises });
        save();
        closeModal();
        render();
      };
    });
  }

  // ---- Event wiring ----
  function attachListeners() {
    const tabSchedule = document.getElementById("tabSchedule");
    const tabRoster = document.getElementById("tabRoster");
    if (tabSchedule) tabSchedule.onclick = () => { view = "schedule"; render(); };
    if (tabRoster) tabRoster.onclick = () => { view = "clients"; render(); };

    const backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.onclick = () => { activeClientId = null; view = "clients"; render(); };

    const calPrev = document.getElementById("calPrev");
    const calNext = document.getElementById("calNext");
    const calToday = document.getElementById("calToday");
    if (calPrev) calPrev.onclick = () => { scheduleDate.setDate(scheduleDate.getDate() - 1); render(); };
    if (calNext) calNext.onclick = () => { scheduleDate.setDate(scheduleDate.getDate() + 1); render(); };
    if (calToday) calToday.onclick = () => { scheduleDate = startOfDay(new Date()); render(); };

    document.querySelectorAll("[data-open-client]").forEach(el => {
      el.onclick = () => { activeClientId = el.getAttribute("data-open-client"); view = "detail"; render(); };
    });

    const addClientFab = document.getElementById("addClientFab");
    if (addClientFab) addClientFab.onclick = showAddClientModal;

    const addSessionBtn = document.getElementById("addSessionBtn");
    if (addSessionBtn) addSessionBtn.onclick = showAddSessionModal;

    const addWorkoutBtn = document.getElementById("addWorkoutBtn");
    if (addWorkoutBtn) addWorkoutBtn.onclick = showAddWorkoutModal;

    document.querySelectorAll("[data-remove-session]").forEach(el => {
      el.onclick = () => {
        const id = el.getAttribute("data-remove-session");
        const client = getActiveClient();
        client.sessions = client.sessions.filter(s => s.id !== id);
        save();
        render();
      };
    });

    document.querySelectorAll("[data-toggle-workout]").forEach(el => {
      el.onclick = () => {
        const id = el.getAttribute("data-toggle-workout");
        const body = document.getElementById("body-" + id);
        const chev = document.getElementById("chev-" + id);
        body.classList.toggle("open");
        chev.classList.toggle("open");
      };
    });

    document.querySelectorAll("[data-delete-workout]").forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-delete-workout");
        const client = getActiveClient();
        client.workouts = client.workouts.filter(w => w.id !== id);
        save();
        render();
      };
    });

    const removeClientBtn = document.getElementById("removeClientBtn");
    if (removeClientBtn) {
      removeClientBtn.onclick = () => {
        const zone = document.getElementById("dangerZone");
        const client = getActiveClient();
        zone.innerHTML = `<div class="danger-confirm">
          <span>Delete ${esc(client.name)} and all data?</span>
          <div style="display:flex;gap:8px">
            <button class="danger-btn-confirm" id="confirmDelete">Delete</button>
            <button class="danger-btn-cancel" id="cancelDelete">Cancel</button>
          </div>
        </div>`;
        document.getElementById("confirmDelete").onclick = () => {
          clients = clients.filter(c => c.id !== client.id);
          save();
          activeClientId = null;
          view = "clients";
          render();
        };
        document.getElementById("cancelDelete").onclick = render;
      };
    }
  }

  load();
  render();
})();
</script>
</body>
</html>
